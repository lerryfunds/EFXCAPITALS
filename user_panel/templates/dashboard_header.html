<header class="appbar">
  <div class="container appbar-inner">
    <div class="appbar-left">
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="{% url "home" %}" class="brand">
        <span class="brand-mark">EX</span>
        <span class="brand-text">EFX<b>CAPITALS</b></span>
      </a>
    </div>
    <div class="appbar-right">
      {% comment %} <button class="icon-btn" title="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="dot"></span></button> {% endcomment %}
      <div class="user-chip">
        <span class="avatar">{{ request.user.username|slice:":2"|upper }}</span>
        <span class="u-name">{{ request.user.get_full_name }}</span>
      </div>
    </div>
  </div>
</header>
