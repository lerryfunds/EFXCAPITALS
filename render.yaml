databases:
  - name: efxcapitals-db
    plan: free
    databaseName: efxcapitals
    user: efxcapitals

services:
  - type: web
    name: efxcapitals-web
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz/
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "gunicorn efxcapitals.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: efxcapitals-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"